<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AERIS — Interactive App Demo</title>
<style>
  /* AERIS app design system, replicated for the mock (the real app is light-only). */
  :root{
    --navy:#1F4E79; --navy-50:#EDF2F8; --navy-800:#173A5C; --navy-900:#102A44;
    --teal:#0D8EA0; --teal-50:#E6F4F6; --teal-700:#0B6E7C;
    --canvas:#F1F4F7; --paper:#FFFFFF; --ink:#1B2733; --muted:#5A6B7B; --faint:#8CA0B3; --line:#DCE4EC;
    --green-100:#DCFCE7; --green-800:#166534; --green-600:#16A34A;
    --amber-100:#FEF3C7; --amber-800:#92400E; --amber-50:#FFFBEB;
    --orange-100:#FFEDD5; --orange-800:#9A3412;
    --red-100:#FEE2E2; --red-800:#991B1B;
    --slate-100:#F1F5F9; --slate-600:#475569; --slate-500:#64748B;
    --p-red:#C0392B; --p-orange:#D97706; --p-amber:#E0B04B; --p-green:#1E8449;
    --shadow:0 1px 2px rgba(16,42,68,.06), 0 3px 10px rgba(16,42,68,.06);
    --pop:0 6px 24px rgba(16,42,68,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--canvas);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .display{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif}
  .mono{font-family:"IBM Plex Mono",Consolas,ui-monospace,monospace}
  a{color:inherit}

  /* ------- demo banner ------- */
  .demo-banner{background:var(--teal);color:#fff;text-align:center;font-size:12px;padding:5px 12px;letter-spacing:.04em}
  .demo-banner b{font-family:"IBM Plex Mono",Consolas,monospace}

  /* ------- top nav (app shell) ------- */
  .topbar{background:var(--navy-900);color:#fff;position:sticky;top:0;z-index:40}
  .topbar-in{max-width:1120px;margin:0 auto;padding:0 20px;height:52px;display:flex;align-items:center;gap:18px}
  .brand{display:flex;align-items:baseline;gap:8px;cursor:pointer}
  .brand b{font-family:"Space Grotesk",system-ui,sans-serif;letter-spacing:.14em;font-size:17px}
  .brand span{font-size:11px;color:#ffffff99}
  nav.main{display:flex;gap:4px;font-size:13.5px;margin-left:6px}
  nav.main .nl{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;color:#ffffffbf;cursor:pointer;font-weight:500;position:relative}
  nav.main .nl:hover{background:#ffffff1a;color:#fff}
  nav.main .nl.active{background:#ffffff26;color:#fff}
  .qbadge{display:grid;place-items:center;height:16px;min-width:16px;border-radius:999px;background:var(--teal);font-size:10px;font-weight:700;padding:0 4px}
  .dropdown{position:relative}
  .dropdown .menu{position:absolute;left:0;top:calc(100% + 4px);background:var(--paper);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;box-shadow:var(--pop);min-width:200px;padding:4px 0;display:none;z-index:50}
  .dropdown.open .menu{display:block}
  .dropdown .menu div{padding:8px 14px;font-size:13.5px;cursor:pointer}
  .dropdown .menu div:hover{background:var(--navy-50)}
  .user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#ffffff99}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
  .kbd{border:1px solid #ffffff4d;border-radius:4px;padding:1px 6px;font-size:10.5px;font-family:"IBM Plex Mono",Consolas,monospace;color:#ffffff99;cursor:pointer}

  /* ------- page frame ------- */
  .page{max-width:1120px;margin:0 auto;padding:24px 20px 72px}
  .eyebrow{font-family:"IBM Plex Mono",Consolas,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
  h1{font-family:"Space Grotesk",system-ui,sans-serif;font-size:23px;font-weight:600;color:var(--navy);margin:2px 0 4px}
  .pdesc{font-size:13.5px;color:var(--muted);margin:0;max-width:64ch}
  .crumb{font-size:12px;color:var(--faint);margin-bottom:10px}
  .crumb a{cursor:pointer;text-decoration:none}
  .crumb a:hover{color:var(--navy)}
  h2.sec{font-family:"Space Grotesk",system-ui,sans-serif;font-size:15px;font-weight:600;margin:22px 0 8px}

  /* ------- primitives ------- */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
  .stat{padding:14px 16px}
  .stat .l{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .stat .v{font-family:"Space Grotesk",system-ui,sans-serif;font-size:24px;font-weight:600;color:var(--navy);margin-top:2px;font-variant-numeric:tabular-nums}
  .stat .h{font-size:11.5px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;background:none;font-family:inherit}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{background:var(--navy-800)}
  .btn-secondary{background:var(--paper);border-color:var(--line);color:var(--ink)}
  .btn-secondary:hover{border-color:var(--navy);color:var(--navy)}
  .btn-success{background:var(--green-600);color:#fff}
  .btn-ghost{color:var(--muted)}
  .btn-ghost:hover{color:var(--navy)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
  .dt-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}
  table.dt thead{background:var(--navy);color:#ffffffe6;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  table.dt th{padding:9px 14px;font-weight:600;white-space:nowrap}
  table.dt td{padding:10px 14px;border-top:1px solid var(--line)}
  table.dt tbody tr{cursor:pointer}
  table.dt tbody tr:hover{background:var(--navy-50)}
  table.dt tbody tr.norow{cursor:default}
  table.dt tbody tr.norow:hover{background:none}

  .badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .s-draft{background:var(--slate-100);color:var(--slate-600)}
  .s-in_review{background:var(--amber-100);color:var(--amber-800)}
  .s-peer_reviewed{background:var(--teal-50);color:var(--teal-700)}
  .s-needs_revision{background:var(--orange-100);color:var(--orange-800)}
  .s-signed{background:var(--green-100);color:var(--green-800)}
  .s-delivered{background:var(--green-600);color:#fff}
  .s-overdue{background:var(--red-100);color:var(--red-800)}
  .pbadge{display:inline-flex;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;color:#fff}
  .p-OVER{background:var(--p-red)} .p-ACTION{background:var(--p-orange)} .p-ACCEPTABLE{background:var(--p-green)} .p-FLAG{background:#7C3AED}

  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
  .chip:hover{border-color:var(--teal)}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip .n{font-family:"IBM Plex Mono",Consolas,monospace;font-size:10.5px;opacity:.75;margin-left:4px}
  .tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
  .tabs div{padding:6px 14px;font-size:13px;cursor:pointer;border-right:1px solid var(--line)}
  .tabs div:last-child{border-right:0}
  .tabs div.on{background:var(--navy);color:#fff;font-weight:600}
  .toolrow-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 10px}
  input.search{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;width:220px;font-family:inherit;background:var(--paper);color:var(--ink)}
  input.search:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}

  /* attention cards */
  .attn{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin:14px 0 4px}
  .attn .a{border-left:4px solid var(--p-amber);padding:11px 14px;display:flex;gap:10px;align-items:center}
  .attn .a.red{border-left-color:var(--p-red)} .attn .a.orange{border-left-color:var(--p-orange)}
  .attn .a .t{font-weight:600;font-size:13px}
  .attn .a .r{font-size:12px;color:var(--muted)}
  .attn .a .cta{margin-left:auto;font-size:12.5px;color:var(--teal);font-weight:600;white-space:nowrap;cursor:pointer}

  /* pulse card */
  .pulse{border-radius:16px;border:1px solid;padding:14px 16px;margin:16px 0;box-shadow:var(--shadow)}
  .pulse.green{border-color:#A7F3D0;background:#ECFDF599} .pulse.amber{border-color:#FDE68A;background:#FFFBEB99}
  .pulse.orange{border-color:#FDBA74;background:#FFF7ED} .pulse.red{border-color:#FCA5A5;background:#FEF2F2}
  .pulse .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pulse .dot{width:13px;height:13px;border-radius:50%}
  .pulse.green .dot{background:#10B981} .pulse.amber .dot{background:#F59E0B} .pulse.orange .dot{background:#F97316} .pulse.red .dot{background:#DC2626}
  .pulse .ttl{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.03em}
  .pulse .sc{font-family:"IBM Plex Mono",Consolas,monospace;font-size:11.5px;color:var(--muted)}
  .pulse .src{font-size:11.5px;color:var(--faint)}
  .pulse ul{margin:8px 0 0;padding-left:26px;font-size:13px}
  .pulse ul li.flag{color:var(--amber-800);font-weight:600}

  /* forms */
  .fgrid{display:grid;gap:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#1b2733cc;margin-bottom:4px}
  .field .hint{font-size:11.5px;color:var(--faint);margin-top:4px}
  select,input[type=number],input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;background:var(--paper);color:var(--ink)}
  select:focus,input:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
  .rowb{display:grid;grid-template-columns:minmax(160px,2fr) 1fr 92px 34px;gap:8px;align-items:center;margin-bottom:8px}
  .rowb .del{border:none;background:none;color:var(--faint);cursor:pointer;font-size:16px;padding:4px}
  .rowb .del:hover{color:var(--p-red)}
  .callout{border-left:4px solid;border-radius:8px;padding:12px 14px;font-size:13px;margin:12px 0}
  .c-info{border-color:#0d8ea066;background:var(--teal-50);color:var(--teal-700)}
  .c-warn{border-color:#FCD34D;background:var(--amber-50);color:var(--amber-800)}
  .c-success{border-color:#86EFAC;background:#F0FDF4;color:var(--green-800)}

  /* assessment detail layout */
  .detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
  @media (max-width:900px){.detail{grid-template-columns:1fr}}
  .rail .card{margin-bottom:14px;padding:14px 16px}
  .rail h3{font-family:"Space Grotesk",system-ui,sans-serif;font-size:12.5px;margin:0 0 8px;color:var(--navy)}
  .trail{font-size:12px;color:var(--muted)}
  .trail div{padding:5px 0;border-bottom:1px dashed var(--line)}
  .trail div:last-child{border-bottom:0}
  .trail .who{color:var(--faint)}
  .lifecycle{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}

  /* toolbox groups */
  .tgroup{margin-bottom:20px}
  .tgroup h3{font-family:"Space Grotesk",system-ui,sans-serif;font-size:13px;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
  .tag{font-size:10px;font-family:"IBM Plex Mono",Consolas,monospace;letter-spacing:.05em;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--faint);white-space:nowrap}
  .tag.built{color:var(--green-800);border-color:#86EFAC;background:var(--green-100)}

  /* deliverable modal */
  .overlay{position:fixed;inset:0;background:#102A44b3;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
  .overlay.open{display:flex}
  .doc{background:#fff;color:#1a2430;max-width:760px;width:100%;border-radius:6px;box-shadow:var(--pop);padding:48px 56px;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.65}
  .doc .lh{display:flex;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:14px;margin-bottom:22px;font-family:Inter,system-ui,sans-serif}
  .doc .lh b{font-family:"Space Grotesk",system-ui,sans-serif;font-size:18px;color:var(--navy);letter-spacing:.02em}
  .doc .lh .m{text-align:right;font-size:11px;color:#5A6B7B;line-height:1.5}
  .doc h1{font-family:Georgia,serif;font-size:21px;color:#102A44;margin:0 0 2px}
  .doc .sub{font-size:12.5px;color:#5A6B7B;font-family:Inter,system-ui,sans-serif;margin-bottom:18px}
  .doc table{width:100%;border-collapse:collapse;font-size:13px;font-family:Inter,system-ui,sans-serif;margin:14px 0}
  .doc th{background:var(--navy);color:#fff;text-align:left;padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .doc td{border:1px solid #DCE4EC;padding:7px 10px}
  .doc .prov{margin-top:26px;border-top:1px solid #DCE4EC;padding-top:14px;font-family:"IBM Plex Mono",Consolas,monospace;font-size:10.5px;color:#5A6B7B;line-height:1.7}
  .doc .sig{margin-top:24px;display:flex;gap:40px;font-family:Inter,system-ui,sans-serif;font-size:12.5px}
  .doc .sig .line{border-top:1px solid #1a2430;padding-top:4px;min-width:220px}
  .doc-actions{position:sticky;top:0;display:flex;justify-content:flex-end;gap:8px;max-width:760px;width:100%;margin:0 auto 10px}

  /* toasts */
  .toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--navy-900);color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:var(--pop);
    animation:tin .18s ease-out;display:flex;gap:8px;align-items:center;max-width:340px}
  .toast.ok::before{content:"✓";color:#4ADE80;font-weight:700}
  @keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

  /* command palette */
  .cmdk{position:fixed;inset:0;background:#102A4480;z-index:85;display:none;align-items:flex-start;justify-content:center;padding-top:90px}
  .cmdk.open{display:flex}
  .cmdk .panel{background:var(--paper);border-radius:12px;box-shadow:var(--pop);width:520px;max-width:92vw;overflow:hidden}
  .cmdk input{width:100%;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:14px 18px;font-size:14.5px}
  .cmdk input:focus{outline:none}
  .cmdk .list{max-height:320px;overflow:auto;padding:6px 0}
  .cmdk .it{padding:9px 18px;font-size:13.5px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
  .cmdk .it:hover,.cmdk .it.sel{background:var(--navy-50)}
  .cmdk .it .k{font-family:"IBM Plex Mono",Consolas,monospace;font-size:10.5px;color:var(--teal)}
  .empty{padding:34px;text-align:center;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>

<div class="demo-banner"><b>INTERACTIVE DEMO</b> — a clickable replica of the AERIS app. All data synthetic; every action is a mock function running in your browser. Nothing is saved.
  <a href="https://claude.ai/code/artifact/a43ce0e2-97c7-4732-aaa9-2eae62001004" style="color:#fff;font-weight:700;margin-left:10px">Metrics showcase →</a></div>

<div class="topbar"><div class="topbar-in">
  <div class="brand" onclick="go('dashboard')"><b>AERIS</b><span>Meridian Industrial Hygiene</span></div>
  <nav class="main" id="nav"></nav>
  <div class="user">
    <span class="kbd" onclick="openCmdk()">Ctrl K</span>
    <span>cih@meridian.demo</span><span class="avatar">JC</span>
  </div>
</div></div>

<main class="page" id="page"></main>

<div class="overlay" id="docOverlay" onclick="if(event.target===this)closeDoc()">
  <div style="width:100%;max-width:760px">
    <div class="doc-actions">
      <button class="btn btn-secondary" onclick="toast('In the real app this opens the browser print dialog → PDF')">Print / Save as PDF</button>
      <button class="btn btn-primary" onclick="closeDoc()">Close</button>
    </div>
    <div class="doc" id="docBody"></div>
  </div>
</div>

<div class="cmdk" id="cmdk" onclick="if(event.target===this)closeCmdk()">
  <div class="panel">
    <input id="cmdkIn" placeholder="Jump to a page, client, or tool…" oninput="renderCmdk()">
    <div class="list" id="cmdkList"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
"use strict";
/* =====================================================================
   AERIS interactive app demo — a faithful mock of the real product.
   State lives in memory; every "server action" below is a mock function
   mirroring its production counterpart (lifecycle.ts, engine.ts, etc.)
   ===================================================================== */

/* ---------------- mock reference libraries ---------------- */
const CHEMS = [
  { cas:"108-88-3",  name:"Toluene",             limit:200,  unit:"ppm",   basis:"OSHA PEL (TWA)" },
  { cas:"67-64-1",   name:"Acetone",             limit:1000, unit:"ppm",   basis:"OSHA PEL (TWA)" },
  { cas:"100-42-5",  name:"Styrene",             limit:100,  unit:"ppm",   basis:"OSHA PEL (TWA)" },
  { cas:"14808-60-7",name:"Silica, respirable",  limit:0.05, unit:"mg/m3", basis:"OSHA PEL 1910.1053" },
  { cas:"18540-29-9",name:"Chromium (VI)",       limit:0.14, unit:"ug/m3", basis:"TSCA ECEL" },
  { cas:"7439-96-5", name:"Manganese (R)",       limit:0.02, unit:"mg/m3", basis:"ACGIH TLV" },
  { cas:"GRAIN",     name:"Grain dust",          limit:10,   unit:"mg/m3", basis:"OSHA PEL (TWA)" },
];
const UNITS = ["ppm","mg/m3","ug/m3","fibers/cc"];

const TOOL_GROUPS = [
  { name:"Core IH workflow", tools:[
    ["01","SDS → Sampling Plan",true],["02","Exposure Results Analyzer",true],["03","SDS Quality / Compliance Review",true],
    ["04","Written Program Gap Analysis",true],["05","Respiratory Protection Program",true],["06","Regulatory Applicability",true],
    ["07","Audit + CAPA",true],["23","Sampling Statistics / Bayesian Engine",true]]},
  { name:"Health standards & programs", tools:[
    ["15","TSCA WCPP / ECEL Compliance",true],["16","HazCom 2024 / GHS Rev 7 Updater",true],["17","Heat Program Builder",true],
    ["18","Medical Surveillance Tracker",true],["19","Records Retention (1910.1020)",true],["20","Expanded Health Standard Packs",true],
    ["09","Noise Survey Planner",true],["14","Reassessment Scheduler",true]]},
  { name:"Practice operations", tools:[
    ["21","Practice Compliance",true],["22","Data Privacy & Medical-Data Safeguards",true],["13","Proposal / SOW Generator",false],
    ["11","Training Matrix Builder",false]]},
  { name:"Planned coverage (honest stubs — fail closed)", tools:[
    ["08","Ergonomic Risk (RULA/REBA)",false],["10","Heat Stress Sampling Planner",false],["12","Confined Space / LOTO",false],
    ["24","HAZWOPER (1910.120)",false],["25","PSM (1910.119) / EPA RMP",false],["26","Bloodborne Pathogens",false],
    ["27","IAQ / Mold / Legionella",false],["28","Ventilation (ACGIH)",false],["29","Asbestos / Lead",false],
    ["30","Arc Flash / NFPA 70E",false],["31","Combustible Dust",false],["32","Environmental Bridges",false],
    ["33","Direct-Reading Instruments",false]]},
];
const TOOL_NAME = {}; const TOOL_BUILT = {};
for (const g of TOOL_GROUPS) for (const [id,n,b] of g.tools) { TOOL_NAME[id]=n; TOOL_BUILT[id]=b; }

/* ---------------- mock workspace state ---------------- */
const CLIENTS = [
  { id:"c1", name:"Northgate Foundry",    industry:"Ferrous casting",   workers:210, sites:["Melt Deck","Shakeout","Fab Shop"],
    pulse:{ drivers:[
      {kind:"exposure",severity:9.5,toolId:"15",detail:"Cr(VI) at 160% of TSCA ECEL — Melt Deck welder, 8-hr TWA"},
      {kind:"program", severity:6.0,toolId:"05",detail:"Respiratory protection program: 4 of 9 required elements missing"},
      {kind:"cadence", severity:2.0,toolId:"14",detail:"Last full reassessment 4 months ago"}], unscored:[] } },
  { id:"c2", name:"Summit Electroplating", industry:"Metal finishing",  workers:85,  sites:["Barrel Line","Rack Line"],
    pulse:{ drivers:[
      {kind:"exposure",severity:7.0,toolId:"09",detail:"Noise dose 118% — barrel line, 1910.95 8-hr TWA 91.2 dBA"},
      {kind:"program", severity:6.5,toolId:"18",detail:"Medical surveillance: 6 workers overdue for audiometric testing"},
      {kind:"cadence", severity:6.2,toolId:"14",detail:"Hex-chrome reassessment 92 days overdue"}], unscored:[] } },
  { id:"c3", name:"Cascade Coatings",      industry:"Industrial painting", workers:60, sites:["Spray Booth 1","Spray Booth 2","Mix Room"],
    pulse:{ drivers:[

const KW = { exposure:.5, program:.3, cadence:.2 };
const BANDS = ["green","amber","orange","red"];
const atLeast = (a,b)=>BANDS[Math.max(BANDS.indexOf(a),BANDS.indexOf(b))];
function computePulse(input){
  const ds = input.drivers.filter(d=>Number.isFinite(d.severity)).map(d=>({...d,severity:Math.min(10,Math.max(0,d.severity))}));
  const worst={}; for(const d of ds) worst[d.kind]=Math.max(worst[d.kind]??0,d.severity);
  const score=Math.round(Object.keys(KW).reduce((s,k)=>s+(worst[k]??0)*KW[k],0)*10)/10;
  let band=score<=3?"green":score<=6?"amber":score<=8?"orange":"red";
  if((worst.exposure??0)>=9)band=atLeast(band,"red");
  if((worst.exposure??0)>=6||(worst.cadence??0)>=6)band=atLeast(band,"orange");
  if(ds.some(d=>d.severity>=4))band=atLeast(band,"amber");
  const flags=input.unscored.map(n=>`Not scored — ${n}`);
  if(flags.length)band=atLeast(band,"amber");
  const top=[...ds].sort((a,b)=>b.severity-a.severity).slice(0,3);
  return {score,band,topDrivers:top,nextToolId:top[0]?.toolId??null,flags};
}
const PULSE_LABEL={green:"STEADY",amber:"WATCH",orange:"DRIFTING",red:"ACT NOW"};

/* Tool 02 engine: % of limit + verdict; fail-closed on unit mismatch */
function analyzeExposure(rows){
  return rows.map(r=>{
    const chem=CHEMS.find(c=>c.cas===r.cas);
    if(!chem) return {...r,verdict:"FLAG",note:"unknown agent"};
    if(r.unit!==chem.unit) return {...r,chem,verdict:"FLAG",pct:null,
      note:`not scored — result in ${r.unit} vs ${chem.basis} limit in ${chem.unit} (unit mismatch)`};
    const pct=Math.round(r.twa/chem.limit*1000)/10;
    return {...r,chem,pct,verdict:pct>=100?"OVER":pct>=50?"ACTION":"ACCEPTABLE",
      note:`${pct}% of ${chem.basis} (${chem.limit} ${chem.unit})`};
  });
}

function stuckReason(a){
  if(a.overdueDays>0) return {sev:"red",  reason:`Reassessment overdue ${a.overdueDays}d`};
  const age=Math.round((new Date(2026,6,28)-a.updated_at)/86400000);
  if(a.status==="in_review"&&age>7) return {sev:"orange",reason:`In review ${age}d — assign a peer reviewer`};
  if(a.status==="draft"&&age>14)    return {sev:"amber", reason:`Draft untouched ${age}d`};
  return null;
}

function narrativeText(a){
  const cl = cname(a.client_id);
  if (a.payload) {
    const parts = a.payload.map(r => r.pct == null
      ? `${r.chem?.name ?? r.cas} could not be scored (unit mismatch) and is excluded from the determinations`
      : `${r.chem?.name ?? r.cas} was measured at ${r.pct}% of its governing limit (${r.verdict})`);
    return `On behalf of ${cl}, personal breathing-zone samples were collected and analyzed in accordance with the governing NIOSH methods. ${parts.join(". ")}. Results at or above the action level trigger the periodic monitoring and medical surveillance provisions of the applicable standard. All numeric determinations were computed by the AERIS engine; this narrative was drafted by AI assist and requires CIH review before issue.`;
  }
  return `This ${TOOL_NAME[a.tool_id] ?? ""} engagement for ${cl} was completed under the practice's standard methodology. The attached determinations were computed deterministically by the tool engine and are reproduced from the stored payload. This draft narrative was generated by AI assist for CIH review and must not be issued unreviewed.`;

function draftNarrative(id){

  let i = 0;
  const iv = setInterval(() => {

      clearInterval(iv);

            ${a.status==="signed"||a.status==="delivered"?`<button class="btn btn-secondary" onclick="openDoc('${a.id}')">View deliverable</button>`:""}
          </div>
          ${a.status==="peer_reviewed"?`<div class="callout c-info"><b>CIH gate:</b> only a credentialed CIH can sign. The demo user holds CIH #10482 — the real app verifies this against Team &amp; credentials before enabling the button.</div>`:""}
          ${a.status==="needs_revision"?`<div class="callout c-warn"><b>Changes requested.</b> Reviewer notes are in the audit trail; revise and resubmit. Nothing signs until review passes.</div>`:""}
          ${a.status==="draft"?`<div class="callout c-info">Submitting locks the payload and notifies the reviewer queue.</div>`:""}
        </div>
      </div>
      <div class="rail">
        <div class="card"><h3>Schedule</h3><div style="font-size:12.5px;color:var(--muted)">
          ${a.overdueDays>0?`<span class="badge s-overdue">overdue ${a.overdueDays}d</span> reassessment window missed`:`Next reassessment auto-scheduled by Tool 14 on signature.`}</div></div>
        <div class="card"><h3>Versions</h3><div style="font-size:12.5px;color:var(--muted)">v${a.versions} ${a.versions>1?"(superseding v"+(a.versions-1)+")":"— initial"}</div></div>
        <div class="card"><h3>Audit trail</h3><div class="trail">
          ${a.trail.map(t=>`<div>${esc(t.what)}<br><span class="who">${esc(t.who)} · ${fmtD(t.when)}</span></div>`).join("")}
        </div></div>
      </div>
    </div>`;
}

function advance(id){
  const a=A.find(x=>x.id===id); const nxt=lifecycleNext(a); if(!nxt)return;
  if(a.status==="peer_reviewed"&&(a.payload??[]).some(r=>r.verdict==="FLAG")&&!a.flagsAcked){
    toast("Blocked: acknowledge the flagged results before signing");return;
  }
  if(a.status==="signed"){ /* export → deliverable */
    a.status="delivered";
    DOCS.unshift({id:"d"+(SEQ++),title:a.title,client:a.client_id,tool:a.tool_id,issued:new Date(2026,6,28),rev:"v"+a.versions});
    a.trail.push({when:new Date(2026,6,28),who:"system",what:"deliverable v"+a.versions+" issued to client library"});
    toast("Deliverable issued — see Practice → Issued documents");
    openDoc(id); render(); return;
  }
  a.status=nxt.to; a.updated_at=new Date(2026,6,28);
  a.trail.push({when:new Date(2026,6,28),who:nxt.who,what:nxt.what});
  toast(nxt.what[0].toUpperCase()+nxt.what.slice(1));
  render();
}

function vQueue(){
  const q=A.filter(a=>["in_review","peer_reviewed"].includes(a.status));
  return `<div class="eyebrow">CIH gate</div><h1>Sign-off queue</h1>
    <p class="pdesc">Nothing leaves the practice without a credentialed signature. Peer review first, then the CIH signs.</p>
    ${q.length?`<div class="dt-wrap" style="margin-top:16px"><table class="dt">
      <thead><tr><th>Title</th><th>Client</th><th>Status</th><th>Waiting</th><th></th></tr></thead>
      <tbody>${q.map(a=>`<tr onclick="go('assessment','${a.id}')">
        <td style="font-weight:600">${esc(a.title)}</td><td>${esc(cname(a.client_id))}</td>
        <td>${badge(a.status)}</td><td style="color:var(--muted)">${rel(a.updated_at)}</td>
        <td style="text-align:right;color:var(--teal);font-weight:600;font-size:12.5px">${a.status==="peer_reviewed"?"Review & sign →":"Open →"}</td></tr>`).join("")}
      </tbody></table></div>`
    :`<div class="card empty" style="margin-top:16px">Queue is clear — nothing awaiting review or signature.</div>`}`;
}

function vDocuments(){
  return `<div class="eyebrow">Practice</div><h1>Issued documents</h1>
    <p class="pdesc">Every deliverable the practice has issued — versioned, signed, and rendered from engine payloads. Click one to view.</p>
    <div class="dt-wrap" style="margin-top:16px"><table class="dt">
      <thead><tr><th>Document</th><th>Client</th><th>Tool</th><th>Rev</th><th>Issued</th></tr></thead>
      <tbody>${DOCS.map(d=>`<tr onclick="openDocByDoc('${d.id}')">
        <td style="font-weight:600">${esc(d.title)}</td><td>${esc(cname(d.client))}</td>
        <td><span class="mono" style="font-size:11px;color:var(--teal)">${d.tool}</span> ${esc(TOOL_NAME[d.tool]??"")}</td>
        <td class="mono" style="font-size:12px">${d.rev}</td><td style="color:var(--muted)">${fmtD(d.issued)}</td></tr>`).join("")}
      </tbody></table></div>`;
}

function vUsage(){
  return `<div class="eyebrow">Practice</div><h1>AI usage &amp; cost</h1>
    <p class="pdesc">AI drafts narrative only — engines own the numbers. Usage is metered per run and per client.</p>
    <div class="stats">
      <div class="card stat"><div class="l">AI-assist runs (July)</div><div class="v">38</div><div class="h">narrative drafting</div></div>
      <div class="card stat"><div class="l">Tokens</div><div class="v">412k</div><div class="h">in + out</div></div>
      <div class="card stat"><div class="l">Est. cost</div><div class="v">$6.14</div><div class="h">this month</div></div>
      <div class="card stat"><div class="l">Engine runs</div><div class="v">96</div><div class="h">$0 — deterministic</div></div>
    </div>
    <div class="callout c-info"><b>Design principle:</b> the expensive, auditable part of IH consulting is judgment and math. AERIS keeps the math deterministic and free; AI is a writing assistant with a meter on it.</div>`;
}

function vTeam(){
  return `<div class="eyebrow">Practice</div><h1>Team &amp; credentials</h1>
    <p class="pdesc">The CIH gate reads from this table — sign-off is impossible without a current credential on file.</p>
    <div class="dt-wrap" style="margin-top:16px"><table class="dt">
      <thead><tr><th>Member</th><th>Role</th><th>Credential</th><th>Expires</th><th>Status</th></tr></thead>
      <tbody>
        <tr class="norow"><td style="font-weight:600">Jordan Calloway</td><td>Principal</td><td>CIH #10482</td><td>Mar 2028</td><td>${badge("signed")}</td></tr>
        <tr class="norow"><td style="font-weight:600">Maya Osei</td><td>Senior IH</td><td>CIH candidate (eligible 2027)</td><td>—</td><td>${badge("in_review")}</td></tr>
        <tr class="norow"><td style="font-weight:600">Sam Reyes</td><td>Field technician</td><td>NIOSH 582 (sampling)</td><td>Nov 2026</td><td>${badge("signed")}</td></tr>
      </tbody></table></div>
    <div class="callout c-warn" style="margin-top:14px"><b>Radar:</b> Sam's NIOSH 582 expires in 4 months — renewal reminder scheduled.</div>`;

/* ---------------- deliverable renderer (house style) ---------------- */
function docHtml(title,client,tool,rev,issued,payload,ptable){
  return `<div class="lh"><div><b>MERIDIAN</b><div style="font-size:11px;color:#5A6B7B">Industrial Hygiene, PLLC</div></div>
      <div class="m">2140 Harbor Ave SW, Suite 300<br>Seattle, WA 98126 · (206) 555-0141<br>AIHA Laboratory-accredited partners</div></div>
    <h1>${esc(title)}</h1>
    <div class="sub">Prepared for ${esc(client)} · Tool ${tool} — ${esc(TOOL_NAME[tool]??"")} · Revision ${rev} · Issued ${fmtD(issued)}</div>
    <p><b>Scope.</b> This report presents the results of personal exposure monitoring and the resulting compliance determinations. All numeric determinations were computed deterministically by the AERIS Tool ${tool} engine and are reproduced verbatim from the stored payload; the narrative was reviewed and approved by the undersigned.</p>
    ${payload?`<table><thead><tr><th>Agent</th><th>Result (8-hr TWA)</th><th>% of limit</th><th>Determination</th></tr></thead>
      <tbody>${payload.map(r=>`<tr><td>${esc(r.chem?.name??r.cas)}</td><td>${r.twa} ${r.unit}</td>
        <td>${r.pct==null?"not scored":r.pct+"%"}</td><td>${r.verdict}${r.pct==null?" — "+esc(r.note):""}</td></tr>`).join("")}</tbody></table>`
    :ptable?`<table><thead><tr>${ptable.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${ptable.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
    :`<p><i>[Engine payload table renders here — plans, gap matrices, schedules, or results depending on the tool.]</i></p>`}
    <p><b>Determinations</b> follow 29 CFR 1910 Subpart Z and, where applicable, TSCA §6(a) workplace chemical protection requirements. Results at or above the action level trigger the periodic monitoring and medical surveillance provisions of the governing standard.</p>
    <div class="sig"><div class="line">Jordan Calloway, CIH #10482<br><span style="color:#5A6B7B">Certified Industrial Hygienist</span></div>
      <div class="line">${fmtD(issued)}<br><span style="color:#5A6B7B">Date of issue</span></div></div>
    <div class="prov">PROVENANCE · engine tool-${tool} v1.4.2 · reference revision DEMO-2026-07 · payload sha256 9f31…c2ae<br>
      peer review: M. Osei · CIH signature: J. Calloway #10482 · rendered by AERIS deliverable service — numbers cannot drift from the computed payload</div>`;
}
function openDoc(assessmentId){
  const a=A.find(x=>x.id===assessmentId);
  $("#docBody").innerHTML=docHtml(a.title,cname(a.client_id),a.tool_id,"v"+a.versions,new Date(2026,6,28),a.payload,a.payloadTable);
  $("#docOverlay").classList.add("open");
}
function openDocByDoc(docId){
  const d=DOCS.find(x=>x.id===docId);
  $("#docBody").innerHTML=docHtml(d.title,cname(d.client),d.tool,d.rev,d.issued,null);
  $("#docOverlay").classList.add("open");
}
function closeDoc(){$("#docOverlay").classList.remove("open");}

/* ---------------- CSV export (real download, like the app's dashboard export) ---------------- */
function exportCsv(){
  const head="title,tool,client,status,updated";
  const lines=A.map(a=>[a.title,TOOL_NAME[a.tool_id]??a.tool_id,cname(a.client_id),a.status,fmtD(a.updated_at)]
    .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  const blob=new Blob([head+"\n"+lines.join("\n")],{type:"text/csv"});
  const u=URL.createObjectURL(blob), aEl=document.createElement("a");
  aEl.href=u; aEl.download="aeris-assessments-demo.csv"; aEl.click(); URL.revokeObjectURL(u);
  toast("CSV exported — "+A.length+" assessments");
}

/* ---------------- command palette ---------------- */
function cmdkItems(){
  return [
    ...NAV.map(([k,l])=>({k:"page",label:l,go:()=>go(k)})),
    ...PRACTICE.map(([k,l])=>({k:"page",label:l,go:()=>go(k)})),
    ...CLIENTS.map(c=>({k:"client",label:c.name,go:()=>go("client",c.id)})),
    ...Object.entries(TOOL_NAME).map(([id,n])=>({k:"tool "+id,label:n,go:()=>go("tool",id)})),
  ];
}
function openCmdk(){$("#cmdk").classList.add("open");$("#cmdkIn").value="";renderCmdk();$("#cmdkIn").focus();}
function closeCmdk(){$("#cmdk").classList.remove("open");}
function renderCmdk(){
  const q=$("#cmdkIn").value.toLowerCase();
  const items=cmdkItems().filter(i=>i.label.toLowerCase().includes(q)).slice(0,10);
  $("#cmdkList").innerHTML=items.length?items.map((i,ix)=>
    `<div class="it" data-ix="${ix}"><span class="k">${i.k}</span>${esc(i.label)}</div>`).join("")
    :`<div class="empty">No matches.</div>`;
  [...$("#cmdkList").children].forEach((el,ix)=>{
    if(items[ix]) el.onclick=()=>{closeCmdk();items[ix].go();};
  });
}
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCmdk();}
  if(e.key==="Escape"){closeCmdk();closeDoc();}
});

/* ---------------- render ---------------- */
function render(){
  renderNav();
  const p=route.page,a=route.arg;
  $("#page").innerHTML =
    p==="dashboard"?vDashboard():
    p==="clients"?vClients():
    p==="client"?vClient(a):
    p==="tools"?vTools():
    p==="tool"?vTool(a):
    p==="assessment"?vAssessment(a):
    p==="queue"?vQueue():
    p==="documents"?vDocuments():
    p==="usage"?vUsage():
    p==="team"?vTeam():vDashboard();
}
render();
</script>
